name: Publish CLI to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (pack only, do not publish)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Least privilege. id-token: write lets npm exchange this job's GitHub
    # OIDC token for a short-lived publish token (trusted publishing) and
    # sign provenance. Nothing here writes to the repo.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # 24: Active LTS, supported to 2028-04-30. This is the runtime that
      # builds the tarball that ships, so it moves only outside a release
      # week. 20 (EOL 2026-04-30) is still tested in cli-ci.yml as the floor.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1
      # (https://docs.npmjs.com/trusted-publishers). Every Node 24 from
      # 24.5.0 bundles at least that, so this is normally a no-op; it exists
      # so a stale runner toolcache can't silently drop us back to token auth.
      - name: Ensure npm supports trusted publishing
        run: |
          have=$(npm --version)
          if node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$have"; then
            echo "npm $have supports trusted publishing."
          else
            echo "::warning::npm $have predates trusted publishing (11.5.1); installing npm@11.19.0."
            npm install -g npm@11.19.0
            npm --version
          fi

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/cli
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match packages/cli/package.json version $PKG"
            exit 1
          fi
          echo "Publishing @passkeybridge/satus@$PKG"

      # The tag guard above only fires for tag pushes, so a workflow_dispatch
      # publish had no version check at all — it would happily republish an
      # existing version (E403 late, after everything else passed) or ship an
      # untagged release from any branch. This runs on every path.
      - name: Check the registry for this version
        id: registry
        working-directory: packages/cli
        run: |
          PKG=$(node -p "require('./package.json').version")
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          if npm view "@passkeybridge/satus@$PKG" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@passkeybridge/satus@$PKG is already on the registry."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Version $PKG is free on the registry."
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::warning::Publishing from ${GITHUB_REF_NAME} without a tag. Push v$PKG afterwards so the release is reproducible from git."
          fi

      # A dispatch that names an already-published version is a mistake: the
      # operator meant to ship something and it would silently not ship.
      - name: Refuse to republish from a manual dispatch
        if: steps.registry.outputs.published == 'true' && github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          echo "::error::@passkeybridge/satus@${{ steps.registry.outputs.version }} is already on the registry. Bump packages/cli/package.json (and src/version.ts) before publishing."
          exit 1

      # A *tag* that names an already-published version is normal and correct.
      # Tag pushes are blocked from some environments, so a release often goes
      # out by dispatch and gets tagged afterwards for reproducibility. Failing
      # that run trains everyone to ignore red builds; it is a no-op, so say so
      # and let the job go green. (This is why the v0.3.7 tag push failed on
      # 2026-08-11 — nothing was wrong, npm had simply already accepted it.)
      - name: Tag records an already-published release
        if: steps.registry.outputs.published == 'true' && github.event_name == 'push'
        run: |
          echo "::notice::@passkeybridge/satus@${{ steps.registry.outputs.version }} is already on the registry; this tag records that release. Nothing to publish."

      - name: Install
        working-directory: packages/cli
        run: npm ci

      # cli-ci.yml has `on.push.branches: [main]`, and a tag push does not
      # match a branch filter — so releases were publishing without a single
      # test having run in CI. Run them here, where it matters most.
      - name: Test
        working-directory: packages/cli
        run: npm test

      - name: Typecheck
        working-directory: packages/cli
        run: npm run typecheck

      - name: Build
        working-directory: packages/cli
        run: npm run build

      # npm 11 (Node 24) checks the registry even on --dry-run and refuses a
      # version that is already published, so between releases the dry run
      # could never pass. When the version is taken, pack instead: same
      # tarball, same file list, no registry write either way. Caught by the
      # first dry run on Node 24, 2026-09-15.
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        working-directory: packages/cli
        run: |
          if [ "${{ steps.registry.outputs.published }}" = "true" ]; then
            echo "::notice::${{ steps.registry.outputs.version }} is already on the registry; packing instead of a publish dry run."
            npm pack --dry-run
          else
            npm publish --access public --dry-run
          fi

      # Auth: npm trusted publishing (OIDC). npm >= 11.5.1 detects GitHub
      # Actions, exchanges this job's OIDC token for a short-lived publish
      # token, and only if that exchange fails falls back to the configured
      # token (docs.npmjs.com/trusted-publishers: "uses them for
      # authentication before falling back to traditional tokens").
      #
      # TRANSITION: NODE_AUTH_TOKEN stays as that fallback until the trusted
      # publisher is saved on npmjs.com and one release has gone out through
      # it (the step below reports which path was used). Then delete this
      # env block and the NPM_PUBLISH_TOKEN secret in a follow-up. The token
      # expires 2026-10-12; after that the fallback is dead either way.
      #
      # --provenance is automatic under OIDC; it stays explicit so the token
      # path keeps signing provenance too.
      - name: Publish
        if: steps.registry.outputs.published == 'false' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: npm publish --access public --provenance

      # Read-only, unauthenticated registry lookup. A version published via
      # trusted publishing carries `_npmUser.trustedPublisher`; one published
      # with a token does not. This is what tells us the fallback can go.
      - name: Report publish auth path
        if: steps.registry.outputs.published == 'false' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
        env:
          VERSION: ${{ steps.registry.outputs.version }}
        run: |
          tp=""
          for i in 1 2 3 4 5 6; do
            if npm view "@passkeybridge/satus@$VERSION" version > /dev/null 2>&1; then
              tp=$(npm view "@passkeybridge/satus@$VERSION" _npmUser.trustedPublisher.id 2>/dev/null || true)
              break
            fi
            sleep 10
          done
          if [ -n "$tp" ]; then
            echo "::notice title=npm auth::@passkeybridge/satus@$VERSION was published via trusted publishing ($tp). The NPM_PUBLISH_TOKEN fallback can be removed."
          else
            echo "::warning title=npm auth::@passkeybridge/satus@$VERSION was NOT published via trusted publishing (token fallback, or registry not yet consistent). Check the trusted publisher on npmjs.com before the token expires 2026-10-12."
          fi
