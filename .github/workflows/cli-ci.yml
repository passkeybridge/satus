name: cli-ci
on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    paths:
      - "packages/cli/**"
      - ".github/workflows/cli-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20 is the declared floor (`engines` in packages/cli/package.json)
        # and has been EOL since 2026-04-30; it stays in the matrix only so
        # the floor is still tested, not because anything should run on it.
        # 24 is what the publish workflow builds the tarball on. Raising the
        # floor is a published-compatibility decision, made separately.
        node: ["20", "24"]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
